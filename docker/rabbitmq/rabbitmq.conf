# EMF local RabbitMQ settings (loaded from /etc/rabbitmq/conf.d/)

log.console = true
log.console.level = info

# EMF single-message consumers acknowledge only after a task is processed (merges can run long),
# so allow up to 2 hours before an unacknowledged delivery closes the channel (default is 30 minutes)
consumer_timeout = 7200000

# Topology and users are provisioned by the rabbitmq-init container, not at boot
