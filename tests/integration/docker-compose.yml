# Services for `pytest -m integration`, ports and credentials match the defaults the integration tests use.
#   docker compose -f tests/integration/docker-compose.yml up -d --wait
#   uv run pytest -m integration
#   docker compose -f tests/integration/docker-compose.yml down -v
name: emfos-integration-tests

services:
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    # Plain port check: rabbitmq-diagnostics runs as root and can create a root-owned .erlang.cookie before the broker
    # does, which then fails to start with eacces
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5672"]
      interval: 5s
      timeout: 10s
      retries: 30

  elasticsearch:
    image: elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 5s
      timeout: 10s
      retries: 30

  # ObjectStorage always connects with HTTPS, so MinIO gets a self-signed certificate
  minio-certs:
    image: alpine/openssl:latest
    command: >-
      req -x509 -newkey rsa:2048 -nodes -days 3650 -subj /CN=localhost
      -addext subjectAltName=DNS:localhost,IP:127.0.0.1
      -keyout /certs/private.key -out /certs/public.crt
    volumes:
      - minio-certs:/certs

  # minio/minio is no longer published on Docker Hub, pgsty/minio is the community maintained build of it
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --certs-dir /certs
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    volumes:
      - minio-certs:/certs:ro
    depends_on:
      minio-certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  minio-certs:
