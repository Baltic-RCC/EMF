[pytest]
# Suite for Baltic-RCC/EMF issue #474 (polars migration). See TEST_PLAN.md in this folder.
# Performance tests are slow and excluded by default:  pytest tests/polars_474 -m performance
addopts = -m "not performance" -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::pandas.errors.PerformanceWarning
log_level = INFO
