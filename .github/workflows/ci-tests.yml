name: CI - Tests

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        run: "pip install --only-binary :all: uv==0.11.32"

      - name: Install dependencies
        run: uv sync --frozen --no-build

      - name: Run tests
        run: uv run --frozen --no-build pytest --cov=emf --cov-report=term
