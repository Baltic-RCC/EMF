[project]
name = "emf"
version = "1.8.0"
description = "Open source tool for European Merging Function"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "polars>=1.0",
    "numpy",
    "pypowsybl==1.16.1",
    "aniso8601",
    "lxml",
    "edx",
    "opdm-api",
    "triplets",
    "ndjson",
    "elasticsearch==8.15.0",
    "minio",
    "pytz",
    "requests",
    "pika",
    "saxonche",
    "croniter",
    "pyarrow>=24.0.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "local-pypi"
url = "https://artifactory.elering.sise/artifactory/api/pypi/pssepip/simple"
#default = true

[tool.uv]
allow-insecure-host = ["artifactory.elering.sise"]
